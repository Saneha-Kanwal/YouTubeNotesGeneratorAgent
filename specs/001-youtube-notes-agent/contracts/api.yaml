openapi: 3.0.3
info:
  title: YouTube Notes AI Agent API
  version: 1.0.0
  description: API for processing YouTube videos and generating structured notes with translation support

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.example.com
    description: Production server

paths:
  /process-video:
    post:
      summary: Process a YouTube video and generate notes
      description: |
        Accepts a YouTube URL, validates it, and initiates background processing.
        Returns a video_id immediately. Processing happens asynchronously.
      operationId: processVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessVideoRequest'
      responses:
        '200':
          description: Video processing initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessVideoResponse'
        '400':
          description: Invalid YouTube URL or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error during processing initiation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /videos/{video_id}:
    get:
      summary: Get video details and notes
      description: Retrieve a processed video with its notes, transcript, and metadata
      operationId: getVideo
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the video
      responses:
        '200':
          description: Video found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /videos/{video_id}/status:
    get:
      summary: Get video processing status
      description: Check the current processing status of a video
      operationId: getVideoStatus
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the video
      responses:
        '200':
          description: Status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStatusResponse'
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /videos:
    get:
      summary: List all processed videos (history)
      description: Get a paginated list of all processed videos, ordered by creation date
      operationId: listVideos
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
      responses:
        '200':
          description: List of videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'

  /videos/{video_id}:
    delete:
      summary: Delete a video and its translations
      description: Remove a video and all associated translations from the system
      operationId: deleteVideo
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the video
      responses:
        '204':
          description: Video deleted successfully
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /translate:
    post:
      summary: Translate notes to a target language
      description: |
        Translate the notes for a video to a specific language.
        If translation already exists, returns existing translation.
        Otherwise, generates new translation and stores it.
      operationId: translateNotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateRequest'
      responses:
        '200':
          description: Translation completed or retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateResponse'
        '400':
          description: Invalid request (missing video_id, invalid language, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Translation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /videos/{video_id}/translations:
    get:
      summary: Get all translations for a video
      description: Retrieve all available translations for a specific video
      operationId: getVideoTranslations
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the video
      responses:
        '200':
          description: List of translations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationListResponse'
        '404':
          description: Video not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ProcessVideoRequest:
      type: object
      required:
        - youtube_url
      properties:
        youtube_url:
          type: string
          format: uri
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          description: Valid YouTube video URL

    ProcessVideoResponse:
      type: object
      required:
        - video_id
        - status
      properties:
        video_id:
          type: string
          format: uuid
          description: Unique identifier for the video
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: Current processing status

    VideoResponse:
      type: object
      required:
        - id
        - youtube_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        youtube_url:
          type: string
        title:
          type: string
          nullable: true
        transcript:
          type: string
          nullable: true
        original_notes:
          type: string
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    VideoStatusResponse:
      type: object
      required:
        - video_id
        - status
      properties:
        video_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, downloading, transcribing, generating_notes, completed, failed]
        progress:
          type: string
          nullable: true
          description: Human-readable progress message
        error:
          type: string
          nullable: true
          description: Error message if status is failed

    VideoListResponse:
      type: object
      required:
        - videos
        - total
        - page
        - limit
      properties:
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoSummary'
        total:
          type: integer
          description: Total number of videos
        page:
          type: integer
        limit:
          type: integer

    VideoSummary:
      type: object
      required:
        - id
        - youtube_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        youtube_url:
          type: string
        title:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    TranslateRequest:
      type: object
      required:
        - video_id
        - target_language
      properties:
        video_id:
          type: string
          format: uuid
          description: Video to translate
        target_language:
          type: string
          pattern: '^[a-z]{2}$'
          example: "es"
          description: ISO 639-1 language code (2 characters)

    TranslateResponse:
      type: object
      required:
        - translation_id
        - video_id
        - target_language
        - translated_notes
        - created_at
      properties:
        translation_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        target_language:
          type: string
        translated_notes:
          type: string
          description: Translated notes in Markdown format
        created_at:
          type: string
          format: date-time
        was_cached:
          type: boolean
          description: Whether translation was retrieved from cache or newly generated

    TranslationListResponse:
      type: object
      required:
        - translations
      properties:
        translations:
          type: array
          items:
            type: object
            required:
              - id
              - target_language
              - created_at
            properties:
              id:
                type: string
                format: uuid
              target_language:
                type: string
              created_at:
                type: string
                format: date-time

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type/code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          nullable: true
          description: Additional error details

